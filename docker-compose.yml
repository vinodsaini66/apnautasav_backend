version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: wedding_manager_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: wedding_manager
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - wedding_network

  redis:
    image: redis:7-alpine
    container_name: wedding_manager_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wedding_network

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:

networks:
  wedding_network:
    driver: bridge